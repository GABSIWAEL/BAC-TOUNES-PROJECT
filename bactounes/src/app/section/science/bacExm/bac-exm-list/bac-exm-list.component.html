<section class="breadcrumb breadcrumb_bg">
  <div class="container text-center">
    <div class="breadcrumb_iner_item">
      <h2>📚 امتحانات الباك - علوم الحياة والأرض</h2>
      <p>نماذج من امتحانات السنوات الفارطة للتحضير الجيد 💪</p>
    </div>
  </div>
</section>

<section class="bac_examples_section " style="background-color:#f9fbfd;">
   <section class="specialite_intro " style="background: #f9fbfd;">
    <div class="container">
        
           
                <app-annonces-in-article></app-annonces-in-article>
            
       
    </div>
</section>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-12 text-center mb-4">
        <h3 style="font-weight:700;">🧾 أمثلة امتحانات الباك</h3>
        <p style="color:#666;">تصفّح امتحانات السنوات السابقة وحضّر روحك للباك 👇</p>
      </div>
    </div>
    

    <div class="row">
      <!-- Example of 10 Bac Exam cards -->
      <div class="col-md-4 col-lg-3 mb-4" *ngFor="let bac of bacExamples">
        <div class="card shadow-sm rounded-lg">
          <img [src]="bac.image" class="card-img-top" alt="Bac Exam Image">
          <div class="card-body text-center">
            <h5 class="card-title">{{ bac.title }}</h5>
            <p class="card-text text-muted">📅 {{ bac.year }}</p>
            <a [routerLink]="['/ScienceExprimentales/SVT/BacExamples', bac.id]" class="btn btn_1">📖 عرض الامتحان</a>
          </div>
        </div>
      </div>
    </div>
  </div>
   <section class="specialite_intro " style="background: #f9fbfd;">
    <div class="container">
        
           
                <app-annonces-in-article></app-annonces-in-article>
            
       
    </div>
</section>
</section>
