<section class="videos_section " style="background-color:#f9fbfd;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-12 text-center mb-4">
        <h3 style="font-weight:700;">📚 تصفّح الفيديوهات</h3>
        <p style="color:#666;">اختار الفيديو إلي تحبّ تتفرّج فيه 👇</p>
      </div>
    </div>

    <div class="row">
      <!-- Example of 10 video cards -->
      <div class="col-md-4 col-lg-3 mb-4" *ngFor="let video of videos">
        <div class="card shadow-sm rounded-lg">
          
          <div class="card-body text-center">
            <h5 class="card-title">{{ video.title }}</h5>
          
            <a [routerLink]="['/ScienceExprimentales/SVT/Videos', video.id]" class="btn btn_1">🎬 عرض الفيديو</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
